<div class="form-container">
    <h2>Update Insurance Policy</h2>

    <form [formGroup]="policyForm" (ngSubmit)="onUpdate()">
        <div class="form-group">
            <label>Policy Number:</label>
            <input formControlName="policyNumber" type="text" required>
        </div>

        <div class="form-group">
            <label>Policy Holder Name:</label>
            <input formControlName="policyHolderName" type="text" required>
        </div>

        <div class="form-group">
            <label>Type:</label>
            <select formControlName="type">
                <option value="Health">Health</option>
                <option value="Life">Life</option>
                <option value="Auto">Auto</option>
                <option value="Home">Home</option>
                <option value="Car">Car</option>
                <option value="Business">Business</option>
            </select>
        </div>

        <div class="form-group">
            <label>Premium Amount:</label>
            <input formControlName="premiumAmount" type="number" required>
        </div>

        <div class="form-group">
            <label>Start Date:</label>
            <input formControlName="startDate" type="date" required>
        </div>

        <div class="form-group">
            <label>End Date:</label>
            <input formControlName="endDate" type="date" required>
        </div>

        <div class="button-group">
            <button type="submit" [disabled]="policyForm.invalid" class="btn-update">Update</button>
            <button type="button" (click)="onDelete()" class="btn-delete">Delete</button>
            <button type="button" (click)="onCancel()" class="btn-cancel">Cancel</button>
        </div>
    </form>
</div>
